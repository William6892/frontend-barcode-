<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Ícono "Control de Salidas": código de barras dentro del visor de escaneo -->
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2152E0"/>
      <stop offset="1" stop-color="#0B1437"/>
    </linearGradient>
    <linearGradient id="beam" x1="12" y1="0" x2="52" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0"/>
      <stop offset=".2" stop-color="#4ADE80"/>
      <stop offset=".8" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- esquinas del visor -->
  <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
    <path d="M13 21v-5a3 3 0 0 1 3-3h5"/>
    <path d="M43 13h5a3 3 0 0 1 3 3v5"/>
    <path d="M51 43v5a3 3 0 0 1-3 3h-5"/>
    <path d="M21 51h-5a3 3 0 0 1-3-3v-5"/>
  </g>

  <!-- barras -->
  <g fill="#FFFFFF">
    <rect x="19" y="20" width="3.5" height="24" rx="1.2"/>
    <rect x="25" y="20" width="2" height="24" rx="1"/>
    <rect x="29.5" y="20" width="5" height="24" rx="1.4"/>
    <rect x="37" y="20" width="2" height="24" rx="1"/>
    <rect x="41.5" y="20" width="3.5" height="24" rx="1.2"/>
  </g>

  <!-- línea láser -->
  <rect x="10" y="30.5" width="44" height="3" rx="1.5" fill="url(#beam)"/>
</svg>
